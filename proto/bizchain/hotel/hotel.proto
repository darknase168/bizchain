syntax = "proto3";

package bizchain.hotel;

import "cosmos_proto/cosmos.proto";

option go_package = "github.com/bizchain/blockchain/x/hotel/types";

// Hotel represents a hotel used in packages
message Hotel {
  uint64 id = 1;
  string name = 2;
  string city = 3;
  string address = 4;
  string star_rating = 5;
  string price_per_night = 6 [(cosmos_proto.scalar) = "cosmos.Int"];
  string room_type = 7;
  uint64 available_rooms = 8;
  string distance_haram = 9;   // jarak ke Masjidil Haram (meter)
  string status = 10;          // active, inactive
  string creator = 11;
  string created_at = 12;
  string updated_at = 13;
}

// Params defines the parameters for the hotel module
message Params {
  bool zero_fee_enabled = 1;
}

// GenesisState defines the genesis state of the hotel module
message GenesisState {
  repeated Hotel hotel_list = 1;
  uint64 hotel_count = 2;
  Params params = 3;
}
